<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="ballShade" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
  </defs>
  <!-- Outer Ball -->
  <circle cx="32" cy="32" r="30" fill="url(#ballShade)" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Center Pentagon -->
  <polygon points="32,22 41,28.5 37.5,39 26.5,39 23,28.5" fill="#0f172a"/>

  <!-- Top Patch -->
  <polygon points="32,2 27,8 37,8" fill="#0f172a"/>
  <line x1="32" y1="8" x2="32" y2="22" stroke="#0f172a" stroke-width="2"/>

  <!-- Top Right Patch -->
  <polygon points="57,17 50,18 53,26" fill="#0f172a"/>
  <line x1="41" y1="28.5" x2="51" y2="21" stroke="#0f172a" stroke-width="2"/>

  <!-- Top Left Patch -->
  <polygon points="7,17 14,18 11,26" fill="#0f172a"/>
  <line x1="23" y1="28.5" x2="13" y2="21" stroke="#0f172a" stroke-width="2"/>

  <!-- Bottom Right Patch -->
  <polygon points="53,49 46,45 44,53" fill="#0f172a"/>
  <line x1="37.5" y1="39" x2="45.5" y2="48" stroke="#0f172a" stroke-width="2"/>

  <!-- Bottom Left Patch -->
  <polygon points="11,49 18,45 20,53" fill="#0f172a"/>
  <line x1="26.5" y1="39" x2="18.5" y2="48" stroke="#0f172a" stroke-width="2"/>

  <!-- Outer Ring Stitching -->
  <line x1="27" y1="8" x2="14" y2="18" stroke="#0f172a" stroke-width="1.8"/>
  <line x1="37" y1="8" x2="50" y2="18" stroke="#0f172a" stroke-width="1.8"/>
  <line x1="53" y1="26" x2="46" y2="45" stroke="#0f172a" stroke-width="1.8"/>
  <line x1="11" y1="26" x2="18" y2="45" stroke="#0f172a" stroke-width="1.8"/>
  <line x1="20" y1="53" x2="44" y2="53" stroke="#0f172a" stroke-width="1.8"/>
</svg>
